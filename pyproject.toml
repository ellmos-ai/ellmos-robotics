[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-robotics"
version = "0.1.0"
description = "Canonical MCP standard (ellmos.robotics.mcp.v1), drivers (ROS 2, ESP32/Serial, LeRobot, MAVLink), and safety envelope for BACH & Open-Ocean."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ellmos-ai" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ellmos-robotics = "ellmos_robotics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

